    const randomColor = function() {
        const hex = '0123456789ABCDEF'
        let color = '#'
        for(let i = 0; i < 6; i++){
        let index =  Math.floor(Math.random() * 15)

            color += hex[index]
        }
        return color;
    }
    let intervalID = null

    document.querySelector('#start').addEventListener('click', () => {
        if(!intervalID) { 
             //This is done because, if i click on start button multiple times, then multiple background changes mught be happening without waiting for previous one to finish. This ensures that a new interval is created on;y when intervalID is null, i.e. no interval initiated.
            intervalID = setInterval(() => {
            document.body.style.backgroundColor = randomColor();
        }, 1000)
        }
    })

    document.querySelector('#stop').addEventListener('click', () => {
        if(intervalID){
            //This is done because, it makes sure if intervalID is not null, that means an interval is ongoing. So then only it will terminate this inteval. After this, since interval is cleared, and no current interval is running, so intervalID is again set back to null. 
            clearInterval(intervalID)
            intervalID = null
        }
    })
</script>
