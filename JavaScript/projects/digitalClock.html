<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        body {
            background-color: #212121;
            color: #fff
        }
        .center {
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: column;
            flex-direction: column;            
        }
        #clock {
            font-size: 40px;
            background-color: orange;
            padding: 20px 50px;
            margin-top: 10px;
            border-radius: 10px; 
        }
    </style> 
</head>
<body>
    <nav style="display: flex; justify-content: center;">Digital Clock</nav>
    <div class="center">
        <div id="banner" style="display: flex; justify-content: center;"><span>Your Local Time</span></div>
        <div id="clock" style="display: flex; justify-content: center;"></div>  
        
        
    </div>
</body>
<script>
    const clock = document.getElementById('clock')
    setInterval(() => {
        let date = new Date()
        clock.innerHTML = date
    }, 1000)
</script>
</html>
