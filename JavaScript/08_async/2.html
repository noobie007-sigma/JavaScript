<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chai Aur Code</h1>
    <button id="stop">Stop</button>
</body>
<script>
    const setTimeoutReference = setTimeout(() => {
        document.querySelector('h1').innerText = "Best JS series!!!"
    }, 2000)

    //If situation arises, we should be able to stop this execution of function after certain time interval. So for this we have clearTimeout().

    document.querySelector('#stop').addEventListener('click', (e) => {
        clearTimeout(setTimeoutReference)
        alert("setTimeout function execution stopped!")
    })


</script>
</html>
