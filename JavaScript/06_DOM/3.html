<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>DOM | Chai Aur Code</title>
</head>
<body style="background-color: #212121; color: #fff">
    <div class="parent">
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
        <div class="day">Friday</div>
        <div class="day">Saturday</div>
        <div class="day">Sunday</div>
    </div>    
</body>

<script>
    const parent = document.querySelector('.parent')
    console.log(parent); //This prints the HTML element with parent class.
    console.log(parent.children); //This returns a nodelist containing all childrens of the specifies parent class. 
    //So to access any child of a parent element, we can use indexing (NodeList == Array-like)
    console.log(parent.children[1].innerHTML);
    //We can run a for loop on a NodeList...
    for (let i = 0; i < parent.children.length; i++) {
        console.log(parent.children[i].innerHTML);
        
    }
    parent.children[0].style.color ='orange'
    //If we dont know indexing, we can access first and last child of a node through firstElementChild and lastELementChild properties
    console.log(parent.firstElementChild) 
    console.log(parent.lastElementChild)
    const day1 = document.querySelector('.day') 
    console.log(day1);
    //querySelector() is an expensive operation, so if we have child, and we want its parent, we can directly access it using parent property.
    console.log(day1.parentElement);
    //We can also access its sibling using nextELementSibling property
    console.log(day1.nextElementSibling);


    console.log("NODES: ", parent.childNodes);
    //childNodes property represents a live collection of child nodes of the specifies parent element. Child nodes include elements, text nodes, whitespaces, and other nodes that are direct children of the specified element.
    //https://chat.openai.com/c/b9beca51-3dfc-4f7c-82a8-3a1a10bab0b5

</script>
</html>
