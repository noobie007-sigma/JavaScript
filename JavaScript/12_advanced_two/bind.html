<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body>
    <button>Button Clicked</button>
</body>
<script>
    class React {
        constructor(){
            this.library = 'React'
            this.server = 'https://localhost:300'

            //requirement: As soon as this page loads, an object of React should get created, and i must get the reference of the button and a method to handle that button.

            document.querySelector('button').addEventListener('click', this.handleClick)
        }

        handleClick(){
            console.log("Button Clicked");
            console.log(this.server)
        }
    }

    const app = new React()
</script>
</html>
